[project]
name = "litellm-guardrail-lean-ctx"
version = "0.1.0"
description = "LiteLLM custom guardrail that compresses context via a lean-ctx proxy server."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "ntk" }]
keywords = ["litellm", "guardrail", "lean-ctx", "context-compression"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  # Only the litellm runtime contract is required; everything else is stdlib.
  "litellm>=1.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "httpx>=0.27",
  "pyyaml>=6",
  "ty>=0.0.77"
]

[project.urls]
Homepage = "https://github.com/impure0xntk/LiteLLM-Guardrail-lean-ctx"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_guardrail_lean_ctx"]

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]

[tool.ty]
# ``GuardrailConfigModel`` in litellm's stubs resolves to
# ``GuardrailConfigModel | BaseModel`` because the runtime class is loaded
# dynamically. The mix-in is correct for pydantic but ty cannot compute a
# stable MRO for it, so we silence the unsupported-base warning at file scope.
[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
# ``GuardrailConfigModel`` is loaded dynamically in litellm so its type is a
# union at type-check time; the runtime mix-in is correct, but ty cannot
# compute a stable MRO for it. The warning is informational.
unsupported-base = "ignore"

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]
log_cli = true
log_cli_level = "INFO"
